<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador de flores Iris</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        form {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        input[type="submit"] {
            background-color: #f58220;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            width: 100%;
            cursor: pointer;
        }

        h3 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>Identifica tu flor</h2>

    <form action="/" method="post">
        <label>Longitud del sépalo:</label>
        <input type="number" step="any" name="val1" required>

        <label>Anchura del sépalo:</label>
        <input type="number" step="any" name="val2" required>

        <label>Longitud del pétalo:</label>
        <input type="number" step="any" name="val3" required>

        <label>Anchura del pétalo:</label>
        <input type="number" step="any" name="val4" required>

        <input type="submit" value="Predecir">
    </form>

    {% if prediction != None %}
        <h3>Resultado: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
